name: httpsms-local

services:
  postgres:
    image: postgres:17.6-alpine
    command: [postgres, -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_parameter_max_length=0, -c, log_parameter_max_length_on_error=0]
    environment:
      POSTGRES_DB: httpsms
      POSTGRES_USER: httpsms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run Prepare-Local.ps1}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U httpsms -d httpsms']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.5-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run Prepare-Local.ps1}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    volumes: [redis:/data]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.local
    env_file: ./.local/api.env
    environment:
      LOCAL_HARDENED: 'true'
      ENV: local
      APP_HOST: 0.0.0.0
      APP_PORT: '8000'
      APP_URL: https://localhost:8443
      APP_NAME: httpSMS Local
      USE_HTTP_LOGGER: 'false'
      ENTITLEMENT_ENABLED: 'false'
      EVENTS_QUEUE_TYPE: postgres
      EVENTS_QUEUE_ENDPOINT: http://127.0.0.1:8000/v1/events
      EVENTS_QUEUE_USER_ID: ${SYSTEM_USER_ID:?Run Prepare-Local.ps1}
      EVENTS_QUEUE_USER_API_KEY: ${SYSTEM_API_KEY:?Run Prepare-Local.ps1}
      DATABASE_URL: postgresql://httpsms:${POSTGRES_PASSWORD}@postgres:5432/httpsms?sslmode=disable
      DATABASE_URL_DEDICATED: postgresql://httpsms:${POSTGRES_PASSWORD}@postgres:5432/httpsms?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CORS_ALLOW_ORIGINS: https://localhost:8443
      CORS_ALLOW_HEADERS: Content-Type,Authorization,X-API-Key,X-Client-Version,X-Receive-ID
      AXIOM_TOKEN: ''
      AXIOM_DATASET_EVENTS: ''
      AXIOM_DATASET_METRICS: ''
      UPTRACE_DSN: ''
      OTEL_SDK_DISABLED: 'true'
      PUSHER_SECRET: ''
      GCS_BUCKET_NAME: ''
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [backend, outbound]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8000/health]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.local
      args:
        FIREBASE_API_KEY: ${FIREBASE_API_KEY:?Configure your own Firebase project}
        FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:?Configure your own Firebase project}
        FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Configure your own Firebase project}
        FIREBASE_APP_ID: ${FIREBASE_APP_ID:?Configure your own Firebase project}
        FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:?Configure your own Firebase project}
    networks: [backend]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  proxy:
    image: caddy:2.10.2-alpine
    environment:
      HTTPSMS_LAN_IP: ${HTTPSMS_LAN_IP:?Run Prepare-Local.ps1}
      HTTPSMS_LAN_CIDR: ${HTTPSMS_LAN_CIDR:?Run Prepare-Local.ps1}
      HTTPSMS_DOCKER_PEER: ${HTTPSMS_DOCKER_PEER:-127.0.0.1}
    ports:
      - '127.0.0.1:8443:8443'
      - '${HTTPSMS_LAN_IP}:8444:8444'
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_started}
    networks: [backend, edge]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

networks:
  backend:
    internal: true
  outbound: {}
  edge: {}

volumes:
  postgres:
  redis:
  caddy_data:
  caddy_config:
